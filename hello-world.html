<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, world!</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7f3ed;
      color: #242424;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      text-align: center;
      padding: 3rem 2rem;
    }
    p {
      color: #666;
      font-size: 1.1rem;
      line-height: 1.6;
    }
    a {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.85rem 1.2rem;
      background: #242424;
      color: white;
      text-decoration: none;
      border-radius: 999px;
    }
    a:hover { background: #444; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, world!</h1>
    <p>My first HTML website is live on my computer.</p>
    <a href="https://developer.mozilla.org/en-US/docs/Learn_web_development/Getting_started/Your_first_website" target="_blank" rel="noopener noreferrer">Learn HTML</a>
  </main>
</body>
</html>
